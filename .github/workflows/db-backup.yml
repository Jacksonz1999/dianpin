name: Verified database backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: dianpin-production-backup
  cancel-in-progress: false

jobs:
  backup:
    # Keep the scheduled workflow dormant until operations has supplied all
    # production secrets and explicitly opted in. No daily red builds while
    # backup infrastructure is still being provisioned.
    if: vars.BACKUPS_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dianpin_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dianpin_restore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump, restore-test, then upload to R2
        run: npm run db:backup
        env:
          # Railway's public proxy URL, never postgres.railway.internal:
          # GitHub-hosted runners cannot join Railway's private network.
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dianpin_restore_test
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PREFIX: dianpin/production
